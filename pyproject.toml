[project]
name = "home-credit-default-risk"
version = "0.1.0"
description = "Home Credit Default Risk prediction — production MLOps pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Mohamed Shakshak" }]

dependencies = [
    "pandas>=2.1,<3",
    "numpy>=1.26,<3",
    "scikit-learn>=1.3,<2",
    "lightgbm>=4.1,<5",
    "xgboost>=2,<3",
    "shap>=0.44,<1",
    "numba>=0.58,<1",
    "mlflow>=2.8,<3",
    "hydra-core>=1.3,<2",
    "omegaconf>=2.3,<3",
    "fastapi>=0.104,<1",
    "uvicorn[standard]>=0.24,<1",
    "pydantic>=2.5,<3",
    "dvc[s3]>=3.30,<4",
    "dagshub>=0.3,<1",
    "structlog>=23.2,<25",
    "joblib>=1.3,<2",
    "psutil>=5.9,<7",
    "python-dotenv>=1.0,<2",
    "pyarrow>=14,<20",
    "python-multipart>=0.0.6",
]

[dependency-groups]
dev = [
    "ruff>=0.1.11",
    "mypy>=1.7",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pre-commit>=3.5",
    "ipykernel>=6.27",
    "nbstripout>=0.6",
    "pandas-stubs>=3.0.3.260530",
]

[project.scripts]
home-credit-train = "home_credit.train:main"
home-credit-predict = "home_credit.predict:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/home_credit"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "TCH", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["N802", "N803", "TC001", "TC002", "TC003"]
"src/home_credit/api/routes/*" = ["B008"]

[tool.mypy]
python_version = "3.11"
mypy_path = ["src"]
packages = ["home_credit"]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
[[tool.mypy.overrides]]
module = [
    "lightgbm.*", "xgboost.*", "shap.*", "dagshub.*", "mlflow.*",
    "scipy.*", "sklearn.*", "joblib.*", "prometheus_fastapi_instrumentator.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=home_credit --cov-report=term-missing --cov-report=html --cov-fail-under=50"
markers = [
    "smoke: lightweight smoke tests",
    "slow: long-running tests",
]

[tool.coverage.run]
source = ["src/home_credit"]
omit = ["*/__init__.py", "tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
